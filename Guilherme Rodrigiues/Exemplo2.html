<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo JavaScript</title>

</head>
<body>
    <div id="Mensagem">
    <p>Conteúdo original.</p>
    </div>

    <script>
        const div = document.getElementById('Mensagem');
        div.innerHTML = '<h2>Novo Título! </h2> <p> O conteúdo foi <em> atualizado </em> com sucesso. </p>';
    </script>

</body>
</html>
